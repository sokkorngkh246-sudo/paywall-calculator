<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Paywall Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Kantumruuy+Pro:wght@400;600;700&display=swap');

    body {
      font-family: 'Plus Jakarta Sans', 'Kantumruuy Pro', sans-serif;
      background: #090d16;
      overflow-x: hidden;
      user-select: none;
    }

    .bg-animated {
      background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #020617);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .glow-effect {
      box-shadow: 0 0 50px -10px rgba(99, 102, 241, 0.25);
    }

    .calc-btn {
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .calc-btn:active {
      transform: scale(0.92);
      filter: brightness(1.2);
    }

    .glassmorphism {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .modal-enter {
      animation: modalSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes modalSlideUp {
      from { transform: translateY(40px) scale(0.96); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    .scan-line {
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #3b82f6, transparent);
      position: absolute;
      animation: scan 2s linear infinite;
    }

    @keyframes scan {
      0% { top: 0%; opacity: 0; }
      50% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }
  </style>
</head>
<body class="bg-animated min-h-screen text-slate-100 flex items-center justify-center p-3 sm:p-6">

  <!-- Floating Ambient Orbs -->
  <div class="fixed top-1/4 left-10 w-72 h-72 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="fixed bottom-1/4 right-10 w-80 h-80 bg-rose-600/15 rounded-full blur-3xl pointer-events-none"></div>

  <!-- App Wrapper -->
  <div class="w-full max-w-md mx-auto relative z-10">

    <!-- Header -->
    <div class="flex items-center justify-between mb-4 px-2">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-500 to-rose-500 flex items-center justify-center shadow-lg">
          <i class="fa-solid fa-calculator text-xs text-white"></i>
        </div>
        <span class="font-bold text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">Pro Calc Pro</span>
      </div>
      <span class="text-[10px] font-semibold uppercase tracking-widest bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-full flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> KHQR Ready
      </span>
    </div>

    <!-- Calculator Device Container -->
    <div class="glassmorphism rounded-3xl p-5 sm:p-6 shadow-2xl border border-white/10 glow-effect relative overflow-hidden">

      <!-- Display Screen -->
      <div class="bg-slate-950/60 rounded-2xl p-4 sm:p-5 mb-5 border border-white/5 flex flex-col justify-end min-h-[120px] text-right relative overflow-hidden shadow-inner">
        <div id="equation-display" class="text-xs sm:text-sm text-slate-400 font-mono tracking-wider min-h-[20px] overflow-x-auto whitespace-nowrap scrollbar-none mb-1"></div>
        <div id="main-display" class="text-3xl sm:text-4xl font-bold tracking-tight text-white font-mono overflow-x-auto whitespace-nowrap scrollbar-none">0</div>
      </div>

      <!-- Keypad Grid -->
      <div class="grid grid-cols-4 gap-2.5 sm:gap-3">
        <button onclick="clearCalc()" class="calc-btn bg-rose-500/15 hover:bg-rose-500/25 text-rose-400 font-semibold p-4 rounded-2xl border border-rose-500/20 text-lg">AC</button>
        <button onclick="toggleSign()" class="calc-btn bg-slate-800/50 hover:bg-slate-700/50 text-slate-300 font-medium p-4 rounded-2xl border border-white/5 text-lg">+/-</button>
        <button onclick="appendOperator('%')" class="calc-btn bg-slate-800/50 hover:bg-slate-700/50 text-slate-300 font-medium p-4 rounded-2xl border border-white/5 text-lg">%</button>
        <button onclick="appendOperator('÷')" class="calc-btn bg-indigo-600/30 hover:bg-indigo-600/40 text-indigo-300 font-semibold p-4 rounded-2xl border border-indigo-500/30 text-xl">÷</button>

        <button onclick="appendNum('7')" class="calc-btn bg-slate-800/30 hover:bg-slate-700/40 text-white font-medium p-4 rounded-2xl border border-white/5 text-xl">7</button>
        <button onclick="appendNum('8')" class="calc-btn bg-slate-800/30 hover:bg-slate-700/40 text-white font-medium p-4 rounded-2xl border border-white/5 text-xl">8</button>
        <button onclick="appendNum('9')" class="calc-btn bg-slate-800/30 hover:bg-slate-700/40 text-white font-medium p-4 rounded-2xl border border-white/5 text-xl">9</button>
        <button onclick="appendOperator('×')" class="calc-btn bg-indigo-600/30 hover:bg-indigo-600/40 text-indigo-300 font-semibold p-4 rounded-2xl border border-indigo-500/30 text-xl">×</button>

        <button onclick="appendNum('4')" class="calc-btn bg-slate-800/30 hover:bg-slate-700/40 text-white font-medium p-4 rounded-2xl border border-white/5 text-xl">4</button>
        <button onclick="appendNum('5')" class="calc-btn bg-slate-800/30 hover:bg-slate-700/40 text-white font-medium p-4 rounded-2xl border border-white/5 text-xl">5</button>
        <button onclick="appendNum('6')" class="calc-btn bg-slate-800/30 hover:bg-slate-700/40 text-white font-medium p-4 rounded-2xl border border-white/5 text-xl">6</button>
        <button onclick="appendOperator('-')" class="calc-btn bg-indigo-600/30 hover:bg-indigo-600/40 text-indigo-300 font-semibold p-4 rounded-2xl border border-indigo-500/30 text-xl">-</button>

        <button onclick="appendNum('1')" class="calc-btn bg-slate-800/30 hover:bg-slate-700/40 text-white font-medium p-4 rounded-2xl border border-white/5 text-xl">1</button>
        <button onclick="appendNum('2')" class="calc-btn bg-slate-800/30 hover:bg-slate-700/40 text-white font-medium p-4 rounded-2xl border border-white/5 text-xl">2</button>
        <button onclick="appendNum('3')" class="calc-btn bg-slate-800/30 hover:bg-slate-700/40 text-white font-medium p-4 rounded-2xl border border-white/5 text-xl">3</button>
        <button onclick="appendOperator('+')" class="calc-btn bg-indigo-600/30 hover:bg-indigo-600/40 text-indigo-300 font-semibold p-4 rounded-2xl border border-indigo-500/30 text-xl">+</button>

        <button onclick="appendNum('0')" class="calc-btn bg-slate-800/30 hover:bg-slate-700/40 text-white font-medium p-4 rounded-2xl border border-white/5 text-xl col-span-2 text-left pl-6">0</button>
        <button onclick="appendDecimal()" class="calc-btn bg-slate-800/30 hover:bg-slate-700/40 text-white font-medium p-4 rounded-2xl border border-white/5 text-xl">.</button>
        <button onclick="handleCalculate()" class="calc-btn bg-gradient-to-r from-indigo-500 to-rose-500 hover:from-indigo-600 hover:to-rose-600 text-white font-bold p-4 rounded-2xl shadow-lg shadow-indigo-500/25 text-xl">=</button>
      </div>
    </div>
  </div>

  <!-- Paywall Modal -->
  <div id="paywall-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-xl z-50 hidden items-center justify-center p-4">
    <div class="modal-enter w-full max-w-sm glassmorphism rounded-3xl p-6 border border-white/10 shadow-2xl text-center relative overflow-hidden max-h-[90vh] overflow-y-auto">
      
      <!-- Lock Icon Header -->
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-rose-500 to-indigo-500 flex items-center justify-center mx-auto mb-3 shadow-lg shadow-rose-500/30">
        <i class="fa-solid fa-lock text-white text-lg"></i>
      </div>

      <h3 class="text-xl font-bold text-white mb-1">Unlock Results</h3>
      <p class="text-xs text-slate-400 mb-4">សាកល្បងបង់ប្រាក់ដើម្បីមើលលទ្ធផលគណនា</p>

      <!-- Plan Cards -->
      <div class="space-y-2.5 mb-4 text-left">
        <label onclick="selectPlan('one-time')" id="plan-one-time-card" class="block p-3 rounded-2xl border border-indigo-500/50 bg-indigo-500/10 cursor-pointer transition-all">
          <div class="flex items-center justify-between">
            <div>
              <div class="flex items-center gap-2">
                <input type="radio" name="plan" id="plan-one-time" checked class="accent-indigo-500">
                <span class="font-bold text-sm text-white">One-time Unlock</span>
              </div>
              <p class="text-[10px] text-slate-400 ml-5">Pay once, unlock calculation result</p>
            </div>
            <span class="text-base font-black text-indigo-400">$0.50</span>
          </div>
        </label>

        <label onclick="selectPlan('yearly')" id="plan-yearly-card" class="block p-3 rounded-2xl border border-white/10 bg-slate-900/40 cursor-pointer transition-all">
          <div class="flex items-center justify-between">
            <div>
              <div class="flex items-center gap-2">
                <input type="radio" name="plan" id="plan-yearly" class="accent-indigo-500">
                <span class="font-bold text-sm text-white">Yearly Subscription</span>
              </div>
              <p class="text-[10px] text-slate-400 ml-5">$0.83/mo, billed annually</p>
            </div>
            <span class="text-base font-black text-slate-300">$10</span>
          </div>
        </label>
      </div>

      <!-- ABA KHQR Container -->
      <div class="bg-slate-950/80 rounded-2xl p-3 border border-white/10 mb-3 text-center relative overflow-hidden">
        <div class="scan-line"></div>
        <p class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-2 flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-qrcode text-indigo-400"></i> Scan via Any Mobile Bank (KHQR)
        </p>
        <div class="w-36 h-36 mx-auto rounded-xl bg-white p-2 shadow-inner mb-2 flex items-center justify-center">
          <img src="aba-qr.jpg" alt="KHQR Code" class="w-full h-full object-contain">
        </div>
        
        <!-- Pay via ABA Mobile Button -->
        <button onclick="handleAbaDeepLink()" class="w-full my-2 bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-3 rounded-xl text-xs flex items-center justify-center gap-2 shadow-lg shadow-red-600/30 transition-all">
          <i class="fa-solid fa-mobile-screen-button"></i>
          <span>Pay via ABA Mobile App</span>
        </button>

        <span id="price-tag-display" class="text-xs font-bold text-indigo-400 bg-indigo-500/10 px-3 py-1 rounded-full border border-indigo-500/20 inline-block mt-1">Amount: $0.50</span>
      </div>

      <!-- Transaction ID Input / Verification -->
      <div class="mb-3 text-left">
        <label class="block text-[11px] font-medium text-slate-400 mb-1">ABA Transaction ID / Hash:</label>
        <input type="text" id="tx-hash-input" placeholder="Enter Transaction ID..." class="w-full bg-slate-900/80 border border-white/10 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors">
      </div>

      <!-- Quick Test Bypass Button (សម្រាប់តេស្តលឿនមិនបាច់វាយលេខ) -->
      <div class="mb-4">
        <button onclick="bypassForTesting()" class="w-full bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-400 border border-emerald-500/30 font-semibold py-2 rounded-xl text-xs transition-colors flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-bolt"></i> ⚡ [Test Mode] Unlock ភ្លាមៗ (សម្រាប់តេស្ត)
        </button>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-2">
        <button onclick="closePaywall()" class="w-1/3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-3 rounded-xl text-xs transition-colors">Cancel</button>
        <button onclick="verifyPayment()" class="w-2/3 bg-gradient-to-r from-indigo-500 to-rose-500 hover:from-indigo-600 hover:to-rose-600 text-white font-bold py-3 rounded-xl text-xs shadow-lg shadow-indigo-500/25 transition-all flex items-center justify-center gap-2">
          <span>Verify & Unlock</span>
          <i class="fa-solid fa-arrow-right text-[10px]"></i>
        </button>
      </div>

    </div>
  </div>

  <!-- Result Modal -->
  <div id="result-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-xl z-50 hidden items-center justify-center p-4">
    <div class="modal-enter w-full max-w-sm glassmorphism rounded-3xl p-6 border border-emerald-500/30 shadow-2xl text-center">
      <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center mx-auto mb-3 text-xl">
        <i class="fa-solid fa-circle-check"></i>
      </div>
      <h3 class="text-xs font-semibold uppercase tracking-widest text-emerald-400 mb-1">Payment Successful!</h3>
      <p class="text-xs text-slate-400 mb-4">Here is your unlocked calculation result:</p>

      <div class="bg-slate-950/80 rounded-2xl p-5 border border-white/10 mb-5">
        <div id="result-equation" class="text-xs text-slate-400 mb-1 font-mono"></div>
        <div id="unlocked-result" class="text-4xl font-extrabold text-white font-mono tracking-tight"></div>
      </div>

      <button onclick="closeResultModal()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-xl text-xs shadow-lg shadow-emerald-500/20 transition-colors">
        Done & Continue
      </button>
    </div>
  </div>

  <script>
    let currentInput = '0';
    let previousInput = '';
    let operator = null;
    let pendingResult = null;
    let selectedPrice = '$0.50';

    const mainDisplay = document.getElementById('main-display');
    const equationDisplay = document.getElementById('equation-display');

    function handleAbaDeepLink() {
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      if (isMobile) {
        window.location.href = "abamobilebank://";
      } else {
        alert("សូមប្រើប្រាស់ទូរស័ព្ទដៃដើម្បីបើកកម្មវិធី ABA Mobile App ឬស្កែន QR Code ខាងលើ!");
      }
    }

    function updateDisplay() {
      mainDisplay.innerText = currentInput;
      if (operator && previousInput) {
        equationDisplay.innerText = `${previousInput} ${operator} ${currentInput}`;
      } else {
        equationDisplay.innerText = '';
      }
    }

    function appendNum(num) {
      if (currentInput === '0') {
        currentInput = num;
      } else {
        currentInput += num;
      }
      updateDisplay();
    }

    function appendDecimal() {
      if (!currentInput.includes('.')) {
        currentInput += '.';
        updateDisplay();
      }
    }

    function clearCalc() {
      currentInput = '0';
      previousInput = '';
      operator = null;
      pendingResult = null;
      updateDisplay();
    }

    function toggleSign() {
      currentInput = (parseFloat(currentInput) * -1).toString();
      updateDisplay();
    }

    function appendOperator(op) {
      if (operator !== null) calculateRaw();
      previousInput = currentInput;
      operator = op;
      currentInput = '0';
      updateDisplay();
    }

    function calculateRaw() {
      let result = 0;
      const prev = parseFloat(previousInput);
      const curr = parseFloat(currentInput);

      if (isNaN(prev) || isNaN(curr)) return;

      switch (operator) {
        case '+': result = prev + curr; break;
        case '-': result = prev - curr; break;
        case '×': result = prev * curr; break;
        case '÷': result = curr !== 0 ? prev / curr : 'Error'; break;
        case '%': result = prev % curr; break;
        default: return;
      }

      pendingResult = {
        equation: `${previousInput} ${operator} ${currentInput}`,
        value: result
      };
    }

    function handleCalculate() {
      if (!operator || previousInput === '') return;
      calculateRaw();
      openPaywall();
    }

    function selectPlan(planType) {
      const oneTimeCard = document.getElementById('plan-one-time-card');
      const yearlyCard = document.getElementById('plan-yearly-card');
      const priceTag = document.getElementById('price-tag-display');

      if (planType === 'one-time') {
        document.getElementById('plan-one-time').checked = true;
        oneTimeCard.className = "block p-3 rounded-2xl border border-indigo-500/50 bg-indigo-500/10 cursor-pointer transition-all";
        yearlyCard.className = "block p-3 rounded-2xl border border-white/10 bg-slate-900/40 cursor-pointer transition-all";
        selectedPrice = '$0.50';
        priceTag.innerText = "Amount: $0.50";
      } else {
        document.getElementById('plan-yearly').checked = true;
        yearlyCard.className = "block p-3 rounded-2xl border border-indigo-500/50 bg-indigo-500/10 cursor-pointer transition-all";
        oneTimeCard.className = "block p-3 rounded-2xl border border-white/10 bg-slate-900/40 cursor-pointer transition-all";
        selectedPrice = '$10.00';
        priceTag.innerText = "Amount: $10.00";
      }
    }

    function openPaywall() {
      document.getElementById('paywall-modal').classList.remove('hidden');
      document.getElementById('paywall-modal').classList.add('flex');
    }

    function closePaywall() {
      document.getElementById('paywall-modal').classList.add('hidden');
      document.getElementById('paywall-modal').classList.remove('flex');
    }

    function bypassForTesting() {
      document.getElementById('tx-hash-input').value = "TEST-MODE-" + Math.floor(Math.random() * 900000 + 100000);
      verifyPayment();
    }

    function verifyPayment() {
      const txInput = document.getElementById('tx-hash-input').value.trim();
      
      if (!txInput) {
        alert("សូមបញ្ចូល Transaction ID ឬចុចប៊ូតុង Test Mode ខាងក្រោម!");
        return;
      }

      closePaywall();

      confetti({
        particleCount: 90,
        spread: 70,
        origin: { y: 0.6 }
      });

      document.getElementById('result-equation').innerText = pendingResult.equation;
      document.getElementById('unlocked-result').innerText = pendingResult.value;

      document.getElementById('result-modal').classList.remove('hidden');
      document.getElementById('result-modal').classList.add('flex');
    }

    function closeResultModal() {
      document.getElementById('result-modal').classList.add('hidden');
      document.getElementById('result-modal').classList.remove('flex');

      currentInput = pendingResult.value.toString();
      previousInput = '';
      operator = null;
      updateDisplay();
    }
  </script>
</body>
</html>
